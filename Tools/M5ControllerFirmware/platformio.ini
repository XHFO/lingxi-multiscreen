; 多屏灵犀 M5 控制器固件（M5Stack StickS3 / ESP32-S3-PICO-1）
;
; 作为主应用（Mac）的蓝牙控制端，通过 BLE GATT 通信：
;   - 摇晃设备  → 翻页当前被控设备内容
;   - 两个按键  → 在被控设备之间循环切换（BtnA=下一台 / BtnB=上一台）
;   - 屏幕      → 显示 Mac 写来的被控设备列表与当前页信息
;
; 说明：PlatformIO 官方板级列表暂无 StickS3，这里用同为 ESP32-S3-PICO-1（8MB Flash、
; 原生 USB）的 m5stack-stamps3 作为编译目标；M5Unified 运行时会按 I2C/GPIO 自动识别
; StickS3，并配置其 135×240 屏幕、BMI270 IMU 与两个按键（GPIO11=BtnA / GPIO12=BtnB）。
;
; 构建 / 刷写：
;   pio run                 # 编译
;   pio run -t upload       # 编译并刷写（USB 连接 StickS3）
;   pio device monitor      # 串口监视（115200）

[env:m5stack-sticks3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py

; StickS3 仅引出原生 USB（枚举为 /dev/cu.usbmodem*）。PlatformIO 默认会
; 自动发现唯一可刷写端口。连接多台串口设备时，可在命令行临时指定：
;   pio run -t upload --upload-port /dev/cu.usbmodemXXXX
;   pio device monitor --port /dev/cu.usbmodemXXXX
; 读串口日志时保持 DTR 拉高、不要动 RTS；RTS/DTR 组合可能让芯片进入 ROM 下载模式。

board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; StickS3 只有原生 USB（USB-Serial/JTAG），默认的 --after hard_reset 走 DTR/RTS 时序，
; 刷完设备会停在 ROM 下载模式（屏幕黑、不广播），必须断电重上电才会跑固件。
; 改成 watchdog reset：用 RTC 看门狗复位芯片，复位后按 strapping 正常启动固件。
board_upload.after_reset = watchdog_reset

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

lib_deps =
    m5stack/M5Unified@^0.2.23
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson@^6.21.3

platform_packages = espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
